# MemGuardOS Web 控制台 Nginx 反向代理模板
#
# 用途：
# - 将本机 MemGuardOS 控制台从 http://127.0.0.1:8765 通过 HTTPS 暴露给受控内网；
# - TLS、访问网段、请求体大小和常见安全头在代理层统一收敛；
# - 业务级 viewer/operator/admin token 仍由 MemGuardOS 控制台校验。
#
# 使用前请替换：
# - server_name
# - ssl_certificate / ssl_certificate_key
# - allow 网段
#
# 建议部署方式：
# 1. memguardos-dashboard 只监听 127.0.0.1:8765；
# 2. Nginx 作为唯一对外入口；
# 3. viewer/operator/admin token 分别放入 root-only 环境文件；
# 4. 生产环境配合防火墙、审计日志和证书轮换策略。

server {
    listen 443 ssl http2;
    server_name memguardos.example.internal;

    ssl_certificate /etc/ssl/certs/memguardos-fullchain.pem;
    ssl_certificate_key /etc/ssl/private/memguardos.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:memguardos_ssl:10m;
    ssl_session_timeout 1h;

    client_max_body_size 256k;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;

    access_log /var/log/nginx/memguardos-access.log;
    error_log /var/log/nginx/memguardos-error.log warn;

    # 示例：仅允许受控内网访问。按现场网段替换。
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name memguardos.example.internal;
    return 301 https://$host$request_uri;
}
