[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memguardos"
dynamic = ["version"]
description = "Local agent memory extraction, governed retrieval and precise forgetting for Linux and openKylin"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "MemGuardOS Project"}]
keywords = ["agent-memory", "openkylin", "linux", "rag", "privacy", "precise-forgetting"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Operating System",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Alexd-star/memguardos"
Repository = "https://github.com/Alexd-star/memguardos"
Documentation = "https://github.com/Alexd-star/memguardos/tree/main/docs"
Issues = "https://github.com/Alexd-star/memguardos/issues"

[project.scripts]
memguard = "memguard.cli.memguard:main"
memctl = "memguard.cli.memctl:main"
memguardd = "memguard.daemon:main"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.6,<0.16"]
security = ["bandit>=1.7", "pip-audit>=2.7"]
agent-openhands = [
    "openhands-sdk==1.28.1",
    "openhands-tools==1.28.1",
    "browser-use==0.11.13",
]

[tool.setuptools.packages.find]
include = ["memguard*"]
exclude = ["data*", "docs*", "scripts*", "tests*"]

[tool.setuptools.dynamic]
version = {attr = "memguard.__version__"}

[tool.setuptools.package-data]
"memguard.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
