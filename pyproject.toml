[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memguardos"
version = "0.1.0"
description = "Linux-oriented agent memory extraction and precise forgetting prototype"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
memguard = "memguard.cli.memguard:main"
memctl = "memguard.cli.memctl:main"
memguardd = "memguard.daemon:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
security = ["bandit>=1.7", "pip-audit>=2.7"]
agent-openhands = [
    "openhands-sdk==1.28.1",
    "openhands-tools==1.28.1",
    "browser-use==0.11.13",
]

[tool.setuptools.packages.find]
include = ["memguard*"]
exclude = ["data*", "docs*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
