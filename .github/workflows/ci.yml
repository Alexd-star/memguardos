name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,security]"

      - name: Lint
        run: |
          python -m compileall -q memguard scripts
          python -m ruff check memguard tests scripts

      - name: Installed distribution smoke
        run: python scripts/smoke_python_distribution.py

      - name: Test
        run: python -m pytest -q

      - name: Docs link check
        run: python scripts/check_docs_links.py

      - name: Metric consistency check
        run: python scripts/check_metric_consistency.py

      - name: Security scan
        run: python scripts/run_security_scan.py

      - name: Web dashboard smoke
        run: python scripts/web_dashboard_smoke.py

      - name: Evaluation smoke
        run: |
          mkdir -p output
          python -m memguard.eval.run_eval --latency-size 100 --latency-queries 100 --output output/eval_result_ci.json --markdown output/eval_report_ci.md

      - name: Competition readiness smoke
        run: python scripts/check_competition_ready.py --eval output/eval_result_ci.json --allow-missing-openkylin

      - name: Submission package smoke
        run: python scripts/package_submission.py

      - name: Submission package audit
        run: python scripts/inspect_submission_package.py

      - name: Submission archive smoke
        run: python scripts/smoke_submission_archive.py
