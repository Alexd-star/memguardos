name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m compileall -q memguard scripts
          python -m ruff check memguard tests scripts

      - name: Test
        run: python -m pytest -q

      - name: Docs link check
        run: python scripts/check_docs_links.py

      - name: Evaluation smoke
        run: python -m memguard.eval.run_eval --latency-size 100 --latency-queries 100 --output docs/eval_result_ci.json --markdown docs/eval_report_ci.md
